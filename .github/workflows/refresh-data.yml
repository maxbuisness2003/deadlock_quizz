name: Обновить каталог предметов

# Раз в неделю подтягивает свежий каталог предметов из открытого API
# и коммитит обновлённую базу, чтобы репозиторий не устаревал.
on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Установить зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Обновить данные
        run: python scripts/refresh.py

      - name: Закоммитить изменения
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/quiz.db
          if git diff --staged --quiet; then
            echo "Изменений нет - коммит не нужен"
          else
            git commit -m "chore(data): обновить каталог предметов из API"
            git push
          fi
