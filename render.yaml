# Render - бесплатный хостинг для этого проекта.
# Как задеплоить: https://render.com/deploy?repo=https://github.com/maxbuisness2003/deadlock_quizz
services:
  - type: web
    name: deadlock-quiz
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: DQ_DATA_DIR
        value: /app/data
